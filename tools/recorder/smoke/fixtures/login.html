<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Demo Login</title></head>
<body>
  <h1>Login (demo)</h1>
  <form action="ok.html" method="get">
    <p><label for="user">Username</label> <input id="user" name="user" type="text"></p>
    <p><label for="pwd">Password</label> <input id="pwd" name="pwd" type="password"></p>
    <p><label for="otp">Verification code</label> <input id="otp" name="otp" type="text" autocomplete="one-time-code"></p>
    <p><label for="card">Card number</label> <input id="card" name="cardNumber" type="text"></p>
    <p><label for="cpf">CPF</label> <input id="cpf" name="cpf" type="text"></p>
    <p><label for="phone">Phone</label> <input id="phone" name="phone" type="tel"></p>
    <p><label for="ticket">Ticket number</label> <input id="ticket" name="numero_chamado" type="text"></p>
    <p><button id="login" type="submit">Sign in</button></p>
  </form>
</body></html>
