name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repo and run tests (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        # 22 = minimum supported by the bundle (engines/target node22);
        # 24 = what the bootstrap installs on end-user machines.
        node: [22, 24]
    defaults:
      run:
        working-directory: tools/recorder
    steps:
      # The committed bundle is stored with LF; without this, Windows runners
      # would check it out with CRLF and the sync check below would always fail.
      - name: Keep original line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/recorder/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Rebuild bundle and notices
        run: npm run build

      # The skill ships its bundle committed (clone-and-use / npx install). This gate
      # guarantees the bundle and the notices never drift from tools/recorder/src.
      - name: Fail if build output differs from the commit
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain .claude/skills/document/scripts/doc-agent.mjs .claude/skills/document/THIRD-PARTY-NOTICES.md)" ]; then
            git --no-pager diff .claude/skills/document/scripts/doc-agent.mjs .claude/skills/document/THIRD-PARTY-NOTICES.md
            echo "::error::The committed bundle or THIRD-PARTY-NOTICES.md is out of sync with tools/recorder/src. Run 'npm run build' in tools/recorder and commit the result."
            exit 1
          fi
