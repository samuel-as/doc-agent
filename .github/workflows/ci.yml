name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        # 22 = minimum supported by the bundle (engines/target node22);
        # 24 = what the bootstrap installs on end-user machines.
        node: [22, 24]
    defaults:
      run:
        working-directory: tools/recorder
    steps:
      # dist/doc-agent.mjs is committed with LF; without this, Windows runners
      # would check it out with CRLF and the sync check below would always fail.
      - name: Keep original line endings
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/recorder/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Rebuild bundle and notices
        run: npm run build

      # The repo is clone-and-use: dist/ and THIRD-PARTY-NOTICES.md are committed
      # on purpose. This gate guarantees they never drift from tools/recorder/src.
      - name: Fail if build output differs from the commit
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain dist/ THIRD-PARTY-NOTICES.md)" ]; then
            git --no-pager diff dist/ THIRD-PARTY-NOTICES.md
            echo "::error::dist/doc-agent.mjs or THIRD-PARTY-NOTICES.md is out of sync with tools/recorder/src. Run 'npm run build' in tools/recorder and commit the result."
            exit 1
          fi
